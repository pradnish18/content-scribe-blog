        value: dq5y3l61j
      - key: CLOUDINARY_API_KEY
        value: 583464728958175
      - key: CLOUDINARY_API_SECRET
        value: UJTsmgStNNOAYbQPVZn_g3EJHUU
      - key: MONGO_URI
        generateValue: true
        # You'll need to update this with your MongoDB Atlas connection string
